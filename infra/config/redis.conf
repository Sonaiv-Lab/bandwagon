# 允許外部連線（如果需要）
bind 0.0.0.0

# RDB snapshot
# save <seconds> <changes>
# 例：15 秒內有 1 個 key 變化就存一次
save 15 1
save 60 1000
save 300 10000
dbfilename dump.rdb
dir /mnt/data/redis

# AOF
appendonly yes
appendfsync everysec   # 每秒 flush，一般性能/安全性平衡
dir /mnt/data/redis

# 記憶體限制
maxmemory 512mb
maxmemory-policy allkeys-lru